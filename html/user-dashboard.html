<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c4a">
  <title>My Workspace | Stackly Remote Collaboration Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
/* STACKLY — user-dashboard (workspace) */
:root{
  --teal:#0f4c4a; --teal-2:#0a3736; --mint:#8fe3cf; --cream:#f5efe1; --amber:#f2b632;
  --bg:#f6f2e8; --card:#fff; --line:rgba(15,76,74,.14); --muted:rgba(15,76,74,.64);
  --ok:#2fae66; --bad:#e5484d; --blue:#3d85c6; --violet:#9b6bd1; --coral:#e07a5f;
  --font-h:'Poppins',sans-serif; --font-b:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --sw:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%;overflow-x:clip}
img{max-width:100%}
.card,.item,.list li,.feed li,.hero,.stat,.col,.tcard{overflow-wrap:anywhere}
body{font-family:var(--font-b);background:var(--bg);color:var(--teal);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit} ul{list-style:none}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:min(var(--sw),86vw);z-index:50;display:flex;flex-direction:column;padding:22px 16px 16px;overflow-y:auto;color:var(--cream);background:linear-gradient(170deg,var(--teal),var(--teal-2))}
.side-head{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.brand{display:flex;justify-content:center;width:100%}.brand img{height:60px;max-width:100%;width:auto;display:block}
.x{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:34px;color:rgba(245,239,225,.7);font-size:1.1rem}
.ws{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:rgba(245,239,225,.08);border:1px solid rgba(245,239,225,.15);font-size:.82rem}
.ws i.l{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:blink 2s ease-in-out infinite;flex:0 0 auto}
.ws b{display:block;font-weight:600}.ws small{opacity:.6;font-size:.72rem}
@keyframes blink{50%{opacity:.35}}
.grp{font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;color:rgba(245,239,225,.4);margin:16px 8px 6px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:.88rem;font-weight:500;color:rgba(245,239,225,.74);transition:background .2s,color .2s,transform .2s}
.nav button i{width:18px;text-align:center;font-size:.9rem}
.nav button:hover{background:rgba(245,239,225,.09);color:#fff;transform:translateX(3px)}
.nav button.on{background:var(--cream);color:var(--teal);font-weight:600}
.nav .n{margin-left:auto;font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--mint);color:var(--teal)}
.side-cta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding:12px;border-radius:40px;font-family:var(--font-h);font-size:.92rem;font-weight:600;background:var(--cream);color:var(--teal);transition:transform .2s,box-shadow .2s}
.side-cta:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.side-user{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px;border-radius:12px;background:rgba(245,239,225,.07);border:1px solid rgba(245,239,225,.12)}
.side-user{margin-top:22px}.side-user div{min-width:0}
.side-user b{display:block;font-size:.85rem;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user small{display:block;font-size:.72rem;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{position:relative;flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-h);font-size:.78rem;font-weight:600;text-transform:uppercase;background:var(--mint);color:var(--teal)}
.av.c1{background:var(--coral);color:#fff}.av.c2{background:var(--blue);color:#fff}.av.c3{background:var(--violet);color:#fff}.av.c4{background:#2aa58a;color:#fff}
.av.on::after,.av.away::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.av.away::after{background:var(--amber)}
.logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:10px;border-radius:10px;font-size:.8rem;font-weight:600;color:#ff9b9d;background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.3);transition:background .2s}
.logout:hover{background:rgba(229,72,77,.22)}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(6,30,29,.6);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s}
.overlay.show{opacity:1;visibility:visible}

/* ---------- Topbar ---------- */
.main{flex:1;min-width:0;margin-left:var(--sw)}
.top{position:-webkit-sticky;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 28px 12px;min-height:66px;background:rgba(246,242,232,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-h);font-size:1.4rem;font-weight:600;white-space:nowrap}
.burger{display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line)}
.search{position:relative;flex:0 1 280px;min-width:0;margin-left:10px}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.8rem;opacity:.5}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:40px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.85rem;color:var(--teal)}
.search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(143,227,207,.4)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.call{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:40px;font-size:.82rem;font-weight:600;color:var(--cream);background:var(--teal);transition:background .2s,transform .2s}
.call:hover{background:#136764;transform:translateY(-1px)}
.ib{position:relative;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);transition:border-color .2s,transform .2s}
.ib:hover{border-color:var(--teal);transform:translateY(-1px)}
.ib em{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff;animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,122,95,.6)}70%,100%{box-shadow:0 0 0 7px rgba(224,122,95,0)}}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.82rem;font-weight:500}
.user-btn .av{width:30px;height:30px;background:var(--teal);color:var(--mint)}
.user-btn>i{font-size:.65rem;opacity:.5}
.uname{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:230px;padding:8px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 40px -12px rgba(15,76,74,.35);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s var(--ease)}
.user.open .menu{opacity:1;visibility:visible;transform:none}
.menu-mail{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-mail small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;opacity:.55}
.menu-mail b{font-size:.82rem;word-break:break-all}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;font-size:.85rem;text-align:left;transition:background .15s}
.menu button:hover{background:rgba(143,227,207,.3)}
.menu .danger{color:var(--bad)}.menu .danger:hover{background:rgba(229,72,77,.1)}

/* ---------- Content ---------- */
.content{padding:26px 28px 56px;max-width:1400px;margin:0 auto}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 34px;margin-bottom:20px;border-radius:20px;color:var(--cream);background:linear-gradient(135deg,var(--teal),var(--teal-2))}
.hero::before{content:"";position:absolute;width:380px;height:380px;right:-100px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(143,227,207,.3),transparent 65%)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(245,239,225,.14) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);mask-image:linear-gradient(90deg,transparent 40%,#000)}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:.74rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;color:var(--mint);margin-bottom:6px}
.hero h2{font-family:var(--font-h);font-size:2rem;font-weight:700;line-height:1.15;margin-bottom:8px;text-transform:capitalize}
.hero p{max-width:520px;opacity:.78;line-height:1.6;font-size:.95rem;font-weight:300}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:40px;font-family:var(--font-h);font-size:.88rem;font-weight:600;border:1.5px solid var(--teal);background:var(--teal);color:var(--cream);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(15,76,74,.6)}
.btn.cream{background:var(--cream);border-color:var(--cream);color:var(--teal)}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.sm{padding:7px 14px;font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .25s,box-shadow .25s,border-color .25s;cursor:pointer}
.stat:hover{transform:translateY(-4px);border-color:var(--teal);box-shadow:0 16px 30px -18px rgba(15,76,74,.5)}
.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stat-top i{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(143,227,207,.45)}
.stat-top span{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(47,174,102,.14);color:#1f8a4f}
.stat b{display:block;font-family:var(--font-h);font-size:2rem;line-height:1.1}
.stat small{display:block;margin-top:4px;font-size:.78rem;color:var(--muted)}
.bar{height:5px;margin-top:12px;border-radius:99px;background:rgba(15,76,74,.09);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--mint));transition:width 1.1s var(--ease) .3s}
.grid2>*,.grid3>*{min-width:0}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
.card{padding:22px;margin-bottom:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-width:0}
.grid2 .card,.grid3 .card{margin-bottom:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h3{font-family:var(--font-h);font-size:1.05rem;font-weight:600;line-height:1.2}
.card-h p{font-size:.8rem;color:var(--muted);margin-top:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;padding:0 10px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid var(--line);font-size:.86rem;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:rgba(143,227,207,.2)}
.t1{font-weight:600}.t2{font-size:.75rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.p-high{background:rgba(229,72,77,.12);color:#c2353a}.p-med{background:rgba(242,182,50,.25);color:#8a6206}.p-low{background:rgba(15,76,74,.1);color:var(--teal)}
.s-todo{background:rgba(15,76,74,.1);color:var(--teal)}.s-doing{background:rgba(61,133,198,.15);color:#2a6aa3}.s-done{background:rgba(47,174,102,.15);color:#1f8a4f}
.feed li,.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-radius:10px;transition:background .15s;cursor:pointer}
.feed li:hover,.list li:hover{background:rgba(143,227,207,.2)}
.feed li>i,.list li>.ico{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:.85rem;background:rgba(143,227,207,.45)}
.feed p{font-size:.85rem;line-height:1.45}
.feed small,.list small{display:block;font-size:.74rem;color:var(--muted);margin-top:2px}
.list li>div{flex:1;min-width:0}.list b{font-size:.88rem}
.right{margin-left:auto;text-align:right;flex:0 0 auto}
.time{flex:0 0 auto;width:54px;text-align:center;padding:6px 0;border-radius:10px;background:var(--teal);color:#fff}
.time span{display:block;font-size:.6rem;letter-spacing:1px;color:var(--mint)}.time b{font-family:var(--font-h);font-size:.95rem}
.proj li{padding:8px 0}
.proj-row{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:6px}.proj-row b{font-family:var(--font-h);font-size:.88rem}
.people li{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:10px;font-size:.88rem}
.people li small{margin-left:auto;font-size:.72rem;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;font-size:.72rem;color:var(--muted)}
.chart i{display:block;width:100%;max-width:44px;height:0;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--mint),var(--teal));transition:height 1s var(--ease) .3s}
.chart div.today i{background:linear-gradient(180deg,var(--amber),#d99a10)}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{padding:14px;border-radius:16px;background:rgba(15,76,74,.05);border:1px solid var(--line);min-width:0}
.col h4{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-h);font-size:.9rem;margin:2px 4px 12px}
.col h4 span{font-size:.72rem;padding:2px 9px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.tcard{padding:14px;margin-bottom:10px;border-radius:12px;background:#fff;border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s}
.tcard:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 14px 26px -16px rgba(15,76,74,.5)}
.tcard h5{font-size:.88rem;margin-bottom:4px}.tcard p{font-size:.76rem;color:var(--muted);margin-bottom:10px}
.tcard-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tcard-f .av{width:26px;height:26px;font-size:.62rem}

/* Messages */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);height:min(620px,calc(100vh - 150px));min-height:460px;padding:0;overflow:hidden;margin-bottom:0}
.chs{border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.chs h4{font-family:var(--font-h);font-size:.9rem;margin:2px 8px 10px}
.ch{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;font-size:.86rem;font-weight:500;text-align:left;transition:background .15s}
.ch:hover{background:rgba(143,227,207,.25)}.ch.on{background:var(--teal);color:var(--cream)}
.ch b{margin-left:auto;font-size:.68rem;padding:1px 8px;border-radius:99px;background:var(--coral);color:#fff}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-h{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--font-h);font-weight:600;font-size:.95rem}
.thread-h small{display:block;font-family:var(--font-b);font-weight:400;font-size:.74rem;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:rgba(246,242,232,.5)}
.m{display:flex;gap:10px;align-items:flex-end;max-width:85%;animation:rise .4s var(--ease)}
.m .b{padding:10px 14px;border-radius:16px 16px 16px 4px;background:#fff;border:1px solid var(--line);font-size:.86rem;line-height:1.5}
.m small{display:block;font-size:.66rem;color:var(--muted);margin-top:3px}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.m.me .b{background:var(--teal);color:var(--cream);border-color:var(--teal);border-radius:16px 16px 4px 16px}
.m.me small{text-align:right}
.typing{display:flex;gap:4px;padding:12px 14px;border-radius:16px 16px 16px 4px;background:#fff;border:1px solid var(--line);width:max-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{30%{transform:translateY(-5px)}60%{transform:none}}
.composer{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;padding:11px 16px;border-radius:40px;border:1.5px solid var(--line);font:inherit;font-size:.88rem;color:var(--teal)}
.composer input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(143,227,207,.4)}
.composer button{width:42px;height:42px;border-radius:50%;background:var(--teal);color:var(--cream);transition:transform .2s}
.composer button:hover{transform:scale(1.08)}

.cards{display:grid;gap:14px}
.item{padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:border-color .2s,transform .2s}
.item:hover{border-color:var(--teal);transform:translateY(-2px)}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.item-top>div:first-child{flex:1 1 200px;min-width:0}
.item h4{font-size:.95rem;margin-bottom:4px}.item p{font-size:.8rem;color:var(--muted)}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.member{padding:24px 18px;text-align:center;border-radius:16px;background:#fff;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.member:hover{transform:translateY(-6px);box-shadow:0 20px 36px -20px rgba(15,76,74,.5)}
.member .av{width:64px;height:64px;font-size:1.1rem;margin:0 auto 12px}
.member .av.on::after,.member .av.away::after{width:14px;height:14px;right:2px;bottom:2px}
.member h4{font-size:1rem}.member small{display:block;color:var(--muted);font-size:.78rem;margin:2px 0 14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow b{display:block;font-size:.92rem}.setrow small{color:var(--muted);font-size:.8rem}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:rgba(15,76,74,.2);transition:background .3s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.sw.on{background:var(--teal)}.sw.on::after{transform:translateX(20px)}
select{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.88rem;color:var(--teal)}
.profile{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.profile .av{width:64px;height:64px;font-size:1.3rem;background:var(--teal);color:var(--mint)}
.profile h4{font-family:var(--font-h);font-size:1.3rem;text-transform:capitalize}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:.9rem}
.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;bottom:26px;z-index:100;transform:translate(-50%,20px);padding:12px 20px;border-radius:40px;background:var(--teal);color:var(--cream);font-size:.86rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media(max-width:1200px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.tgrid{grid-template-columns:1fr 1fr}}
@media(max-width:1024px){
  .side{transform:translateX(-100%);transition:transform .35s var(--ease)}
  .side.open{transform:none}
  .main{margin-left:0}.x,.burger{display:grid;place-items:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
}
@media(max-width:720px){
  .content{padding:18px 16px 44px}.top{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
  .search,.call span,.uname{display:none}.call{padding:10px 12px}.user-btn{padding:3px}
  .grid3,.tgrid{grid-template-columns:1fr}.hero{padding:24px 20px;text-align:center;justify-content:center}
  .hero h2{font-size:1.6rem}.top h1{font-size:1.15rem}
  .hero>div{display:flex;flex-direction:column;align-items:center}
  .tw{overflow:visible}table{min-width:0}
  table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}
  tbody tr{padding:12px 6px;border-bottom:1px solid var(--line);border-radius:10px}
  tbody tr:last-child{border-bottom:0}
  td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 8px;border:0}
  td[data-label]::before{content:attr(data-label);flex:0 0 auto;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  td:first-child{display:block;padding-bottom:8px}
  .hero .btn{flex:1 1 auto}
  .chat{grid-template-columns:1fr;height:auto}
  .chs{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .chs h4{display:none}.ch{width:auto;flex:0 0 auto;white-space:nowrap}
  .msgs{height:340px;flex:none}
  .setrow{flex-wrap:wrap}
}
@media(max-width:480px){.stats{grid-template-columns:1fr}.card{padding:16px}.item{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}

<body>
<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="side" id="side">
    <div class="side-head">
      <a href="../index.html" class="brand"><img src="../assets/stackly_logo.webp" alt="Stackly logo"></a>
      <button class="x" id="closeSide" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="ws"><i class="l"></i><div><b>Product Team</b><small>9 online &middot; 3 time zones</small></div></div>

    <p class="grp">Workspace</p>
    <nav class="nav" id="navMain"></nav>
    <p class="grp">Account</p>
    <nav class="nav" id="navAcc"></nav>

    <button class="side-cta" id="newMeet"><i class="fa-solid fa-video"></i> Start instant meeting</button>

    <div class="side-user">
      <span class="av on" id="sAv">?</span>
      <div><b id="sName">Member</b><small id="sMail">&mdash;</small></div>
    </div>
    <button class="logout" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </aside>

  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <h1 id="pageTitle">Dashboard</h1>
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Search tasks, docs, people" aria-label="Search"></label>
      <div class="top-r">
        <button class="call" id="topMeet"><i class="fa-solid fa-video"></i><span>Start meeting</span></button>
        <button class="ib" id="bell" aria-label="Notifications"><i class="fa-solid fa-bell"></i><em></em></button>
        <div class="user" id="user">
          <button class="user-btn" id="userBtn"><span class="av" id="tAv">?</span><span class="uname" id="tName">Member</span><i class="fa-solid fa-chevron-down"></i></button>
          <div class="menu">
            <div class="menu-mail"><small>Signed in as</small><b id="tMail">&mdash;</b></div>
            <button data-nav="settings"><i class="fa-solid fa-gear"></i> Settings</button>
            <button class="danger" id="menuLogout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// STACKLY — user-dashboard.js
// Member workspace: reads the session saved by login.js (localStorage 'user' + 'isAuthenticated').
(function () {
  'use strict';

  /* ---------- Session ---------- */
  function getUser() {
    try {
      if (localStorage.getItem('isAuthenticated') !== 'true') return null;
      var u = JSON.parse(localStorage.getItem('user') || 'null');
      return u && u.email ? u : null;
    } catch (e) { return null; }
  }
  var user = getUser();
  if (!user) { location.replace('./login.html'); return; }
  if (user.role === 'admin') { location.replace('./admin-dashboard.html'); return; }

  var email = user.email, uname = email.split('@')[0], initial = uname.charAt(0).toUpperCase();
  function logout() {
    ['user', 'isAuthenticated', 'stacklyNav'].forEach(function (k) { localStorage.removeItem(k); });
    location.href = './login.html';
  }

  /* ---------- Helpers ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var toastT;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2400);
  }
  function hour() { var h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
  function nowTime() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

  /* ---------- Sample data (replace with API data) ---------- */
  var PROJECTS = { launch: 'Q4 Product Launch', web: 'Website Redesign', mobile: 'Mobile App v2', growth: 'Growth Experiments' };
  var tasks = [
    { id: 1, title: 'Finalise launch announcement copy', proj: 'launch', due: 'Today', pri: 'high', st: 'doing', who: 'AR', c: 'c1' },
    { id: 2, title: 'Review homepage wireframes', proj: 'web', due: 'Today', pri: 'med', st: 'todo', who: 'DS', c: 'c2' },
    { id: 3, title: 'QA pass on onboarding flow', proj: 'mobile', due: 'Tomorrow', pri: 'high', st: 'doing', who: 'PN', c: 'c3' },
    { id: 4, title: 'Set up A/B test for pricing page', proj: 'growth', due: 'Oct 16', pri: 'low', st: 'todo', who: 'MK', c: 'c4' },
    { id: 5, title: 'Update API docs for v2 endpoints', proj: 'mobile', due: 'Oct 18', pri: 'med', st: 'todo', who: 'AR', c: 'c1' },
    { id: 6, title: 'Design handoff for pricing cards', proj: 'web', due: 'Oct 12', pri: 'med', st: 'done', who: 'DS', c: 'c2' },
    { id: 7, title: 'Publish customer case study', proj: 'launch', due: 'Oct 10', pri: 'low', st: 'done', who: 'PN', c: 'c3' }
  ];
  var meetings = [
    { h: '10:30', ap: 'AM', t: 'Daily standup', who: 'Product team', n: 9, live: true },
    { h: '1:00', ap: 'PM', t: 'Launch readiness review', who: 'Marketing + Eng', n: 12 },
    { h: '3:30', ap: 'PM', t: 'Design critique', who: 'Design team', n: 6 },
    { h: '9:00', ap: 'AM', t: 'Sprint planning (tomorrow)', who: 'Product team', n: 9 }
  ];
  var docs = [
    { n: 'Q4 launch plan', i: 'fa-file-lines', by: 'Aarav M.', when: '12 min ago', ed: 3 },
    { n: 'Pricing page copy v3', i: 'fa-file-pen', by: 'Priya N.', when: '1 hr ago', ed: 1 },
    { n: 'Onboarding research notes', i: 'fa-book-open', by: 'Rohan I.', when: 'Yesterday', ed: 0 },
    { n: 'Brand guidelines 2026', i: 'fa-palette', by: 'Dev S.', when: '2 days ago', ed: 0 },
    { n: 'API integration spec', i: 'fa-code', by: 'Maya K.', when: '3 days ago', ed: 2 }
  ];
  var team = [
    { n: 'Aarav Mehta', r: 'Head of Product', st: 'on', c: 'c1', i: 'AM', tz: 'IST' },
    { n: 'Priya Nair', r: 'People & Culture', st: 'on', c: 'c3', i: 'PN', tz: 'IST' },
    { n: 'Dev Sharma', r: 'Lead Designer', st: 'away', c: 'c2', i: 'DS', tz: 'GMT' },
    { n: 'Maya Kim', r: 'Engineering Manager', st: 'on', c: 'c4', i: 'MK', tz: 'PST' },
    { n: 'Rohan Iyer', r: 'Security Engineer', st: 'off', c: 'c1', i: 'RI', tz: 'IST' },
    { n: 'Sara Lopez', r: 'Customer Success', st: 'on', c: 'c3', i: 'SL', tz: 'CET' }
  ];
  var feed = [
    { i: 'fa-circle-check', t: '<b>Dev</b> completed "Design handoff for pricing cards"', w: '20 min ago' },
    { i: 'fa-comment', t: '<b>Priya</b> mentioned you in #product-launch', w: '1 hr ago' },
    { i: 'fa-file-lines', t: '<b>Aarav</b> edited "Q4 launch plan"', w: '2 hrs ago' },
    { i: 'fa-video', t: 'Recording of "Design critique" is ready', w: 'Yesterday' },
    { i: 'fa-user-plus', t: '<b>Sara</b> joined the Product Team workspace', w: '2 days ago' }
  ];
  var channels = [
    { id: 'launch', n: 'product-launch', u: 2, m: [
      { w: 'AM', c: 'c1', t: 'Launch deck is ready for review. Comments welcome!', tm: '9:12 AM' },
      { w: 'DS', c: 'c2', t: 'Nice! Pinning feedback directly in the doc.', tm: '9:20 AM' },
      { me: 1, t: 'Great, we ship to staging at 3pm.', tm: '9:31 AM' },
      { w: 'PN', c: 'c3', t: '@' + uname + ' can you confirm the pricing copy?', tm: '10:02 AM' } ] },
    { id: 'design', n: 'design-team', u: 0, m: [
      { w: 'DS', c: 'c2', t: 'New icon set is in Figma. Thoughts?', tm: 'Yesterday' },
      { me: 1, t: 'Looks crisp. Love the rounded corners.', tm: 'Yesterday' } ] },
    { id: 'eng', n: 'engineering', u: 1, m: [
      { w: 'MK', c: 'c4', t: 'Deploy is green. Monitoring error rates.', tm: '8:45 AM' } ] },
    { id: 'random', n: 'random', u: 0, m: [
      { w: 'SL', c: 'c3', t: 'Anyone up for a virtual coffee at 4?', tm: 'Mon' } ] }
  ];
  var replies = ['Sounds good!', 'Thanks, noted. I will follow up shortly.', 'On it.', 'Great point. Let us sync in standup.', 'Perfect, thank you!'];
  var settings = { push: true, digest: true, sound: false, tz: 'IST (UTC+5:30)' };
  var activeCh = 'launch', filter = '';

  var pages = {
    dashboard: { title: 'Dashboard', icon: 'fa-gauge-high', group: 'main' },
    messages: { title: 'Messages', icon: 'fa-comments', group: 'main' },
    projects: { title: 'Projects', icon: 'fa-table-columns', group: 'main' },
    meetings: { title: 'Meetings', icon: 'fa-video', group: 'main' },
    docs: { title: 'Docs', icon: 'fa-file-lines', group: 'main' },
    team: { title: 'Team', icon: 'fa-user-group', group: 'main' },
    settings: { title: 'Settings', icon: 'fa-gear', group: 'acc' }
  };
  var PRI = { high: 'High', med: 'Medium', low: 'Low' }, ST = { todo: 'To do', doing: 'In progress', done: 'Done' };

  /* ---------- Fragments ---------- */
  function bar(p) { return '<div class="bar"><i data-w="' + p + '"></i></div>'; }
  function av(i, c, st) { return '<span class="av ' + c + ' ' + (st || '') + '">' + i + '</span>'; }
  function statCard(i, icon, val, label, note, pct, go) {
    return '<div class="stat rise" style="--i:' + i + '" data-nav="' + go + '"><div class="stat-top"><i class="fa-solid ' + icon + '"></i><span>' + note + '</span></div><b data-count="' + val + '">0</b><small>' + label + '</small>' + bar(pct) + '</div>';
  }
  function matches(s) { return !filter || s.toLowerCase().indexOf(filter) > -1; }
  function taskRows(list) {
    if (!list.length) return '<tr><td><div class="empty">No tasks match your search.</div></td></tr>';
    return list.map(function (t) {
      return '<tr data-nav="projects"><td><div class="t1">' + esc(t.title) + '</div><div class="t2">' + PROJECTS[t.proj] + '</div></td><td data-label="Due">' + t.due + '</td><td data-label="Priority"><span class="tag p-' + t.pri + '">' + PRI[t.pri] + '</span></td><td data-label="Status"><span class="tag s-' + t.st + '">' + ST[t.st] + '</span></td><td data-label="Owner">' + av(t.who, t.c) + '</td></tr>';
    }).join('');
  }
  var taskHead = '<thead><tr><th>Task</th><th>Due</th><th>Priority</th><th>Status</th><th>Owner</th></tr></thead>';

  /* ---------- Pages ---------- */
  function pageDashboard() {
    var open = tasks.filter(function (t) { return t.st !== 'done' && matches(t.title + ' ' + PROJECTS[t.proj]); });
    var dueToday = tasks.filter(function (t) { return t.due === 'Today' && t.st !== 'done'; }).length;
    var unread = channels.reduce(function (a, c) { return a + c.u; }, 0);
    var online = team.filter(function (m) { return m.st === 'on'; }).length;
    var projHtml = Object.keys(PROJECTS).map(function (k) {
      var all = tasks.filter(function (t) { return t.proj === k; }), d = all.filter(function (t) { return t.st === 'done'; }).length;
      var p = all.length ? Math.round(d / all.length * 100) : 0;
      return '<li><div class="proj-row"><span>' + PROJECTS[k] + '</span><b>' + p + '%</b></div>' + bar(p) + '</li>';
    }).join('');
    var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], vals = [58, 72, 64, 88, 76, 30, 18], td = (new Date().getDay() + 6) % 7;

    return '<div class="hero rise"><div><div class="eyebrow">' + hour() + '</div><h2>Welcome back, ' + esc(uname) + '</h2><p>You have ' + dueToday + ' tasks due today and ' + unread + ' unread messages. Your next meeting starts at ' + meetings[0].h + ' ' + meetings[0].ap + '.</p></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn cream" data-meet><i class="fa-solid fa-video"></i> Start meeting</button><button class="btn ghost" style="color:var(--cream);border-color:rgba(245,239,225,.45)" data-nav="projects"><i class="fa-solid fa-plus"></i> New task</button></div></div>' +
      '<section class="stats">' +
        statCard(1, 'fa-list-check', dueToday, 'Tasks due today', tasks.length + ' total', 55, 'projects') +
        statCard(2, 'fa-comments', unread, 'Unread messages', 'Across ' + channels.length + ' channels', 40, 'messages') +
        statCard(3, 'fa-video', meetings.length, 'Meetings coming up', 'Next: ' + meetings[0].h + ' ' + meetings[0].ap, 70, 'meetings') +
        statCard(4, 'fa-user-group', online, 'Teammates online', 'of ' + team.length, 80, 'team') +
      '</section>' +
      '<section class="grid2"><div class="card rise" style="--i:5"><div class="card-h"><div><h3>My tasks</h3><p>What needs your attention</p></div><button class="btn ghost sm" data-nav="projects">Open board</button></div><div class="tw"><table>' + taskHead + '<tbody>' + taskRows(open.slice(0, 5)) + '</tbody></table></div></div>' +
      '<div class="card rise" style="--i:6"><div class="card-h"><div><h3>Recent activity</h3><p>Across your workspace</p></div></div><ul class="feed">' +
        feed.map(function (f) { return '<li data-nav="messages"><i class="fa-solid ' + f.i + '"></i><div><p>' + f.t + '</p><small>' + f.w + '</small></div></li>'; }).join('') + '</ul></div></section>' +
      '<section class="grid3">' +
        '<div class="card rise" style="--i:7"><div class="card-h"><div><h3>Today\'s meetings</h3><p>Join with one click</p></div></div><ul class="list">' +
          meetings.slice(0, 3).map(function (m) { return '<li data-nav="meetings"><div class="time"><span>' + m.ap + '</span><b>' + m.h + '</b></div><div><b>' + esc(m.t) + '</b><small>' + esc(m.who) + '</small></div></li>'; }).join('') + '</ul></div>' +
        '<div class="card rise" style="--i:8"><div class="card-h"><div><h3>Who\'s online</h3><p>Across time zones</p></div></div><ul class="people">' +
          team.slice(0, 5).map(function (m) { return '<li>' + av(m.i, m.c, m.st) + '<span>' + m.n + '</span><small>' + (m.st === 'on' ? 'Online' : m.st === 'away' ? 'Away' : 'Offline') + ' &middot; ' + m.tz + '</small></li>'; }).join('') + '</ul></div>' +
        '<div class="card rise" style="--i:9"><div class="card-h"><div><h3>Project progress</h3><p>Tasks completed</p></div></div><ul class="proj">' + projHtml + '</ul></div>' +
      '</section>' +
      '<div class="card rise" style="--i:10"><div class="card-h"><div><h3>Team activity this week</h3><p>Messages, edits and completed tasks</p></div></div><div class="chart">' +
        days.map(function (d, i) { return '<div class="' + (i === td ? 'today' : '') + '"><i data-h="' + vals[i] + '"></i>' + d + '</div>'; }).join('') + '</div></div>';
  }

  function pageMessages() {
    var ch = channels.filter(function (c) { return c.id === activeCh; })[0];
    return '<div class="card chat rise"><div class="chs"><h4>Channels</h4>' +
      channels.map(function (c) { return '<button class="ch' + (c.id === activeCh ? ' on' : '') + '" data-ch="' + c.id + '"># ' + c.n + (c.u ? '<b>' + c.u + '</b>' : '') + '</button>'; }).join('') + '</div>' +
      '<div class="thread"><div class="thread-h"># ' + ch.n + '<small>' + team.filter(function (m) { return m.st === 'on'; }).length + ' members online</small></div><div class="msgs" id="msgs">' + ch.m.map(msgHtml).join('') + '</div>' +
      '<form class="composer" id="composer" autocomplete="off"><input id="msgIn" placeholder="Message #' + ch.n + '" aria-label="Message" maxlength="400"><button type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form></div></div>';
  }
  function msgHtml(m) {
    return '<div class="m' + (m.me ? ' me' : '') + '">' + (m.me ? '' : av(m.w, m.c)) + '<div><div class="b">' + esc(m.t) + '</div><small>' + m.tm + '</small></div></div>';
  }

  function pageProjects() {
    var cols = ['todo', 'doing', 'done'];
    return '<div class="card-h rise"><div><h3 style="font-size:1.15rem">Project board</h3><p style="font-size:.82rem;color:var(--muted)">Tap a task\'s action button to move it forward</p></div><button class="btn sm" data-soon><i class="fa-solid fa-plus"></i> New task</button></div><div class="board">' +
      cols.map(function (s, i) {
        var list = tasks.filter(function (t) { return t.st === s && matches(t.title + ' ' + PROJECTS[t.proj]); });
        var lbl = s === 'todo' ? 'Start' : s === 'doing' ? 'Complete' : 'Reopen';
        return '<div class="col rise" style="--i:' + (i + 1) + '"><h4>' + ST[s] + '<span>' + list.length + '</span></h4>' + (list.map(function (t) {
          return '<div class="tcard"><h5>' + esc(t.title) + '</h5><p>' + PROJECTS[t.proj] + ' &middot; Due ' + t.due + '</p><div class="tcard-f"><span class="tag p-' + t.pri + '">' + PRI[t.pri] + '</span>' + av(t.who, t.c) + '<button class="btn ghost sm" data-move="' + t.id + '">' + lbl + '</button></div></div>';
        }).join('') || '<div class="empty">Nothing here</div>') + '</div>';
      }).join('') + '</div>';
  }

  function pageMeetings() {
    return '<div class="card rise"><div class="card-h"><div><h3>Meetings</h3><p>Today and tomorrow</p></div><button class="btn sm" data-soon><i class="fa-solid fa-calendar-plus"></i> Schedule</button></div><div class="cards">' +
      meetings.filter(function (m) { return matches(m.t + ' ' + m.who); }).map(function (m, i) {
        return '<div class="item rise" style="--i:' + (i + 1) + '"><div class="item-top"><div><h4>' + esc(m.t) + '</h4><p>' + m.h + ' ' + m.ap + ' &middot; ' + esc(m.who) + ' &middot; ' + m.n + ' attendees</p></div><div class="acts">' +
          (m.live ? '<span class="tag s-done">Live now</span>' : '') + '<button class="btn sm" data-join="' + esc(m.t) + '"><i class="fa-solid fa-video"></i> Join</button><button class="btn ghost sm" data-soon>Details</button></div></div></div>';
      }).join('') + '</div></div>';
  }

  function pageDocs() {
    var list = docs.filter(function (d) { return matches(d.n + ' ' + d.by); });
    return '<div class="card rise"><div class="card-h"><div><h3>Shared docs</h3><p>Edit together, live</p></div><button class="btn sm" data-soon><i class="fa-solid fa-plus"></i> New doc</button></div><div class="cards">' +
      (list.map(function (d, i) {
        return '<div class="item rise" style="--i:' + (i + 1) + '" data-soon><div class="item-top"><div><h4><i class="fa-solid ' + d.i + '" style="color:var(--teal)"></i> ' + esc(d.n) + '</h4><p>Edited by ' + d.by + ' &middot; ' + d.when + '</p></div><div class="acts">' +
          (d.ed ? '<span class="tag s-doing">' + d.ed + ' editing</span>' : '') + '<button class="btn ghost sm" data-soon>Open</button></div></div></div>';
      }).join('') || '<div class="empty">No docs match your search.</div>') + '</div></div>';
  }

  function pageTeam() {
    var list = team.filter(function (m) { return matches(m.n + ' ' + m.r); });
    return '<div class="tgrid">' + (list.map(function (m, i) {
      return '<div class="member rise" style="--i:' + i + '">' + av(m.i, m.c, m.st) + '<h4>' + m.n + '</h4><small>' + m.r + ' &middot; ' + m.tz + '</small><button class="btn ghost sm" data-ch-go="launch"><i class="fa-solid fa-comment"></i> Message</button></div>';
    }).join('') || '<div class="card empty">No teammates match your search.</div>') + '</div>';
  }

  function toggleRow(key, title, sub) {
    return '<div class="setrow"><div><b>' + title + '</b><small>' + sub + '</small></div><button class="sw' + (settings[key] ? ' on' : '') + '" data-toggle="' + key + '" role="switch" aria-checked="' + settings[key] + '" aria-label="' + title + '"></button></div>';
  }
  function pageSettings() {
    return '<div class="card rise"><div class="card-h"><div><h3>Profile</h3><p>Your account details</p></div></div><div class="profile"><span class="av">' + esc(initial) + '</span><div><h4>' + esc(uname) + '</h4><small style="color:var(--muted)">' + esc(email) + '</small></div></div><button class="btn ghost sm" data-soon>Edit profile</button></div>' +
      '<div class="card rise" style="--i:1"><div class="card-h"><div><h3>Preferences</h3><p>Notifications and time zone</p></div></div>' +
        toggleRow('push', 'Mentions & replies', 'Notify me when someone mentions me') +
        toggleRow('digest', 'Daily digest email', 'A morning recap of tasks and meetings') +
        toggleRow('sound', 'Message sounds', 'Play a sound for new messages') +
        '<div class="setrow"><div><b>Time zone</b><small>Used for meetings and reminders</small></div><select id="tz">' + ['IST (UTC+5:30)', 'GMT (UTC+0)', 'CET (UTC+1)', 'PST (UTC-8)'].map(function (z) { return '<option' + (z === settings.tz ? ' selected' : '') + '>' + z + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="card rise" style="--i:2"><div class="card-h"><div><h3>Session</h3><p>Signed in as ' + esc(email) + '</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost sm" data-soon>Change password</button><button class="btn sm" id="setLogout" style="background:var(--bad);border-color:var(--bad)"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div></div>';
  }
  var renderers = { dashboard: pageDashboard, messages: pageMessages, projects: pageProjects, meetings: pageMeetings, docs: pageDocs, team: pageTeam, settings: pageSettings };

  /* ---------- Shell ---------- */
  var active = localStorage.getItem('stacklyNav');
  if (!pages[active]) active = 'dashboard';

  function renderNav() {
    var unread = channels.reduce(function (a, c) { return a + c.u; }, 0);
    ['main', 'acc'].forEach(function (g) {
      $(g === 'main' ? 'navMain' : 'navAcc').innerHTML = Object.keys(pages).filter(function (k) { return pages[k].group === g; }).map(function (k) {
        var n = k === 'messages' && unread ? '<span class="n">' + unread + '</span>' : '';
        return '<button data-nav="' + k + '" class="' + (k === active ? 'on' : '') + '"><i class="fa-solid ' + pages[k].icon + '"></i>' + pages[k].title + n + '</button>';
      }).join('');
    });
  }
  function countUp() {
    [].forEach.call(document.querySelectorAll('[data-count]'), function (el) {
      var end = +el.getAttribute('data-count'), t0 = null;
      (function step(t) {
        if (!t0) t0 = t;
        var p = Math.min((t - t0) / 900, 1);
        el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    });
  }
  function animate() {
    requestAnimationFrame(function () {
      [].forEach.call(document.querySelectorAll('.bar i[data-w]'), function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
      [].forEach.call(document.querySelectorAll('.chart i[data-h]'), function (el) { el.style.height = (el.getAttribute('data-h') * 1.3) + 'px'; });
    });
  }
  function render(keepScroll) {
    $('pageTitle').textContent = pages[active].title;
    $('content').innerHTML = renderers[active]();
    renderNav(); animate(); countUp();
    if (!keepScroll) scrollTo(0, 0);
    var ms = $('msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
    var sl = $('setLogout'); if (sl) sl.addEventListener('click', logout);
    var cf = $('composer'); if (cf) cf.addEventListener('submit', sendMsg);
  }
  function go(id) {
    active = id; localStorage.setItem('stacklyNav', id);
    closeSide(); $('user').classList.remove('open'); render();
  }
  function openSide() { $('side').classList.add('open'); $('overlay').classList.add('show'); }
  function closeSide() { $('side').classList.remove('open'); $('overlay').classList.remove('show'); }

  /* ---------- Chat ---------- */
  function sendMsg(e) {
    e.preventDefault();
    var inp = $('msgIn'), v = inp.value.trim();
    if (!v) return;
    var ch = channels.filter(function (c) { return c.id === activeCh; })[0], box = $('msgs');
    var m = { me: 1, t: v, tm: nowTime() }; ch.m.push(m);
    box.insertAdjacentHTML('beforeend', msgHtml(m)); inp.value = ''; box.scrollTop = box.scrollHeight;
    var typing = document.createElement('div'); typing.className = 'typing'; typing.innerHTML = '<i></i><i></i><i></i>';
    setTimeout(function () {
      if (active !== 'messages') return;
      box.appendChild(typing); box.scrollTop = box.scrollHeight;
      setTimeout(function () {
        if (typing.parentNode) typing.parentNode.removeChild(typing);
        var who = team[Math.floor(Math.random() * 4)], r = { w: who.i, c: who.c, t: replies[Math.floor(Math.random() * replies.length)], tm: nowTime() };
        ch.m.push(r);
        if (active === 'messages' && activeCh === ch.id && $('msgs')) { $('msgs').insertAdjacentHTML('beforeend', msgHtml(r)); $('msgs').scrollTop = $('msgs').scrollHeight; }
      }, 1300);
    }, 600);
  }

  /* ---------- Chrome ---------- */
  ['sName', 'tName'].forEach(function (id) { $(id).textContent = uname; });
  ['sMail', 'tMail'].forEach(function (id) { $(id).textContent = email; });
  ['sAv', 'tAv'].forEach(function (id) { $(id).textContent = initial; });

  /* ---------- Events (delegated) ---------- */
  $('burger').addEventListener('click', openSide);
  $('closeSide').addEventListener('click', closeSide);
  $('overlay').addEventListener('click', closeSide);
  $('logoutBtn').addEventListener('click', logout);
  $('menuLogout').addEventListener('click', logout);
  $('newMeet').addEventListener('click', function () { toast('Instant meeting link copied. Share it with your team.'); closeSide(); });
  $('topMeet').addEventListener('click', function () { toast('Starting an instant meeting...'); });
  $('bell').addEventListener('click', function () { toast('2 new mentions: #product-launch and Q4 launch plan.'); });
  $('userBtn').addEventListener('click', function (e) { e.stopPropagation(); $('user').classList.toggle('open'); });
  $('q').addEventListener('input', function (e) {
    filter = e.target.value.trim().toLowerCase();
    if (active === 'dashboard' || active === 'projects' || active === 'meetings' || active === 'docs' || active === 'team') render(true);
    else if (filter) { active = 'dashboard'; render(true); }
    var q = $('q'); if (q) q.focus();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSide(); $('user').classList.remove('open'); } });

  document.addEventListener('click', function (e) {
    $('user').classList.remove('open');
    var t = e.target;
    var mv = t.closest('[data-move]');
    if (mv) {
      var task = tasks.filter(function (x) { return x.id === +mv.getAttribute('data-move'); })[0];
      task.st = task.st === 'todo' ? 'doing' : task.st === 'doing' ? 'done' : 'todo';
      toast('Moved to "' + ST[task.st] + '".'); render(true); return;
    }
    var chb = t.closest('[data-ch]');
    if (chb) {
      activeCh = chb.getAttribute('data-ch');
      channels.forEach(function (c) { if (c.id === activeCh) c.u = 0; });
      render(true); return;
    }
    var cg = t.closest('[data-ch-go]');
    if (cg) { activeCh = cg.getAttribute('data-ch-go'); go('messages'); return; }
    var j = t.closest('[data-join]');
    if (j) { toast('Joining "' + j.getAttribute('data-join') + '"...'); return; }
    if (t.closest('[data-meet]')) { toast('Starting an instant meeting...'); return; }
    var nav = t.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var sw = t.closest('[data-toggle]');
    if (sw) {
      var k = sw.getAttribute('data-toggle'); settings[k] = !settings[k];
      sw.classList.toggle('on', settings[k]); sw.setAttribute('aria-checked', settings[k]); return;
    }
    if (t.closest('[data-soon]')) toast('This feature is coming soon.');
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'tz') { settings.tz = e.target.value; toast('Time zone saved.'); }
  });

  render();
})();
</script>
</body>
</html>
